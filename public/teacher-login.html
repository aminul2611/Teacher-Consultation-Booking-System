<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Sign in or create a Campus Connect teacher account."
    >
    <title>Teacher Portal | Campus Connect</title>

    <link rel="stylesheet" href="css/teacher-login.css">
    <script type="module" src="js/teacher-login.js"></script>
</head>

<body>
    <main class="auth-shell">
        <section class="visual-panel" aria-label="Teacher portal introduction">
            <a
                class="brand-lockup"
                href="index.html"
                aria-label="Campus Connect home"
            >
                <img
                    class="brand-logo"
                    src="images/campus-logo.png"
                    alt="SWUST logo"
                >

                <span class="brand-copy">
                    <span class="brand-name">Campus Connect</span>
                    <span class="brand-subtitle">SWUST</span>
                </span>
            </a>

            <div class="teacher-artwork">
                <img
                    src="images/teacher-portal.png"
                    alt="Teacher welcoming students to the consultation portal"
                >
            </div>

            <div class="visual-copy">
                <p class="eyebrow">TEACHER WORKSPACE</p>
                <h1>Make every consultation count.</h1>
                <p>
                    Share your available times and guide students through
                    meaningful conversations.
                </p>
            </div>
        </section>

        <section class="form-panel" aria-label="Teacher account">
            <div class="auth-content">
                <span class="role-badge">TEACHER</span>

                <header class="auth-heading">
                    <h2 id="teacher-auth-heading">Welcome back</h2>
                    <p id="teacher-auth-description">
                        Sign in to your teacher account.
                    </p>
                </header>

                <div
                    class="auth-tabs"
                    role="tablist"
                    aria-label="Teacher account options"
                >
                    <button
                        class="auth-tab active"
                        id="teacher-login-tab"
                        type="button"
                        role="tab"
                        aria-selected="true"
                        aria-controls="teacher-login-panel"
                    >
                        Sign in
                    </button>

                    <button
                        class="auth-tab"
                        id="teacher-register-tab"
                        type="button"
                        role="tab"
                        aria-selected="false"
                        aria-controls="teacher-register-panel"
                    >
                        Create account
                    </button>
                </div>

                <div
                    class="form-message"
                    id="teacher-auth-message"
                    role="status"
                    aria-live="polite"
                    hidden
                ></div>

                <section
                    id="teacher-login-panel"
                    role="tabpanel"
                    aria-labelledby="teacher-login-tab"
                >
                    <form id="teacher-login-form" class="auth-form">
                        <div class="form-field">
                            <label for="teacher-login-email">
                                Email address
                            </label>
                            <input
                                id="teacher-login-email"
                                name="email"
                                type="email"
                                autocomplete="email"
                                placeholder="you@example.com"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="teacher-login-password">
                                Password
                            </label>

                            <div class="password-field">
                                <input
                                    id="teacher-login-password"
                                    name="password"
                                    type="password"
                                    autocomplete="current-password"
                                    placeholder="Enter your password"
                                    required
                                >

                                <button
                                    class="password-toggle"
                                    type="button"
                                    data-password-toggle="teacher-login-password"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                >
                                    Show
                                </button>
                            </div>
                        </div>

                        <button class="primary-button" type="submit">
                            Sign in
                        </button>
                    </form>
                </section>

                <section
                    id="teacher-register-panel"
                    role="tabpanel"
                    aria-labelledby="teacher-register-tab"
                    hidden
                >
                    <form id="teacher-register-form" class="auth-form">
                        <div class="form-field">
                            <label for="teacher-full-name">Full name</label>
                            <input
                                id="teacher-full-name"
                                name="full_name"
                                type="text"
                                autocomplete="name"
                                placeholder="Enter your full name"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="teacher-register-email">
                                Email address
                            </label>
                            <input
                                id="teacher-register-email"
                                name="email"
                                type="email"
                                autocomplete="email"
                                placeholder="you@example.com"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="teacher-department">Department</label>
                            <input
                                id="teacher-department"
                                name="department"
                                type="text"
                                placeholder="Enter your department"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="teacher-id">Teacher ID</label>
                            <input
                                id="teacher-id"
                                name="student_id"
                                type="text"
                                placeholder="Enter your teacher ID"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="teacher-profile-photo">
                                Profile photo <span>(optional)</span>
                            </label>

                            <input
                                id="teacher-profile-photo"
                                name="photo"
                                type="file"
                                accept="image/png,image/jpeg,image/webp"
                            >

                            <img
                                id="teacher-photo-preview"
                                class="photo-preview"
                                alt="Selected profile photo preview"
                                hidden
                            >

                            <small>PNG, JPG, or WebP. Maximum size: 2 MB.</small>
                        </div>

                        <div class="form-field">
                            <label for="teacher-register-password">
                                Password
                            </label>

                            <div class="password-field">
                                <input
                                    id="teacher-register-password"
                                    name="password"
                                    type="password"
                                    autocomplete="new-password"
                                    placeholder="Create a password"
                                    minlength="8"
                                    required
                                >

                                <button
                                    class="password-toggle"
                                    type="button"
                                    data-password-toggle="teacher-register-password"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                >
                                    Show
                                </button>
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="teacher-confirm-password">
                                Confirm password
                            </label>

                            <div class="password-field">
                                <input
                                    id="teacher-confirm-password"
                                    name="confirm_password"
                                    type="password"
                                    autocomplete="new-password"
                                    placeholder="Enter your password again"
                                    minlength="8"
                                    required
                                >

                                <button
                                    class="password-toggle"
                                    type="button"
                                    data-password-toggle="teacher-confirm-password"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                >
                                    Show
                                </button>
                            </div>
                        </div>

                        <button class="primary-button" type="submit">
                            Create teacher account
                        </button>
                    </form>
                </section>

                <a class="back-link" href="index.html">
                    Back to portal selection
                </a>
            </div>
        </section>
    </main>
</body>
</html>
