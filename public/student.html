<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | Campus Connect</title>
    <link rel="stylesheet" href="css/student.css?v=portal4">
    <script type="module">
        import("./js/student.js?v=portal3").catch((error) => {
            const status = document.getElementById("student-status");
            status.textContent = "Could not load the portal. " + error.message;
            status.hidden = false;
        });
    </script>
</head>
<body>
    <div class="student-shell">
        <header class="student-header">
            <a class="student-brand" href="index.html">
                <img src="images/campus-logo.png" alt="SWUST logo">
                <span><strong>Campus Connect</strong><small>SWUST</small></span>
            </a>
            <div class="student-account">
                <span class="avatar" id="student-avatar" aria-hidden="true">S</span>
                <strong id="student-name">Student</strong>
                <button class="button" id="profile-open-button" type="button">My profile</button>
                <button class="button" id="logout-button" type="button">Log out</button>
            </div>
        </header>

        <main>
            <section class="student-hero" aria-labelledby="portal-title">
                <p class="eyebrow">Student portal</p>
                <h1 id="portal-title">Book a consultation</h1>
                <p>Find a teacher, pick a time, and track your requests.</p>
            </section>
            <p id="student-status" class="portal-status" role="status">Loading your portal…</p>
            <noscript>Enable JavaScript to use the student portal.</noscript>

            <div class="portal-grid" id="student-workspace" hidden>
                <section class="panel" aria-labelledby="directory-title">
                    <h2 id="directory-title">Find a teacher</h2>
                    <label for="teacher-search">Search by name or department</label>
                    <div class="search-row">
                        <input
                            id="teacher-search"
                            type="search"
                            placeholder="e.g. Software Engineering"
                            autocomplete="off"
                            aria-controls="teacher-results"
                        >
                        <button
                            class="button"
                            id="browse-teachers"
                            type="button"
                            aria-expanded="false"
                            aria-controls="teacher-results"
                        >Browse names</button>
                    </div>
                    <div class="teacher-results" id="teacher-results" aria-label="Matching teachers" hidden></div>
                    <p id="directory-status" class="muted" role="status"></p>

                    <article class="selected-teacher" id="selected-teacher" hidden>
                        <div class="teacher-heading">
                            <div class="teacher-identity" id="teacher-identity"></div>
                            <button class="button" id="change-teacher" type="button">Change</button>
                        </div>
                        <div class="slot-panel">
                            <h3>Available times</h3>
                            <div id="teacher-slots"></div>
                            <div class="actions">
                                <button class="button primary" id="book-slot" type="button" disabled>
                                    Book selected time
                                </button>
                                <button
                                    class="button"
                                    id="toggle-request"
                                    type="button"
                                    aria-controls="request-form"
                                    aria-expanded="false"
                                >Request another time</button>
                            </div>
                            <form id="request-form" hidden>
                                <div class="request-fields">
                                    <label for="preferred-date">
                                        Preferred date (DD/MM/YYYY)
                                        <span class="date-field">
                                            <span id="preferred-date-text" aria-hidden="true">DD/MM/YYYY</span>
                                            <span aria-hidden="true">▦</span>
                                            <input id="preferred-date" type="date" required>
                                        </span>
                                    </label>
                                    <label for="preferred-time">
                                        Preferred time
                                        <input id="preferred-time" type="time" required>
                                    </label>
                                    <label class="field-wide" for="request-message">
                                        Message (optional)
                                        <textarea id="request-message" rows="2" maxlength="500"
                                            placeholder="What would you like to discuss?"></textarea>
                                    </label>
                                </div>
                                <button class="button primary" id="send-request" type="submit">Send request</button>
                            </form>
                            <p id="booking-status" class="inline-status" role="status"></p>
                        </div>
                    </article>
                </section>

                <section class="panel" aria-labelledby="consultations-title">
                    <div class="panel-heading">
                        <h2 id="consultations-title">My consultations</h2>
                        <button class="button" id="refresh-activity" type="button">Refresh</button>
                    </div>
                    <div id="activity-feed" class="activity-feed">
                        <p class="muted">Loading your consultations…</p>
                    </div>
                    <details class="history" id="consultation-history" hidden>
                        <summary>View history <span id="history-count"></span></summary>
                        <div id="history-feed" class="activity-feed"></div>
                    </details>
                </section>
            </div>
        </main>

        <footer class="student-footer">Campus Connect · SWUST</footer>
    </div>
</body>
</html>
