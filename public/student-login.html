<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in or create your Campus Connect student account.">

    <title>Student Portal | Campus Connect</title>

    <link rel="stylesheet" href="css/student-login.css">
    <script type="module" src="js/student-login.js"></script>
</head>

<body>
    <main class="auth-shell">
        <section class="visual-panel" aria-label="Student portal introduction">
            <a class="brand-lockup" href="index.html" aria-label="Campus Connect home">
                <img
                    class="brand-logo"
                    src="images/campus-logo.png"
                    alt="Southwest University of Science and Technology logo"
                >

                <span class="brand-copy">
                    <span class="brand-name">Campus Connect</span>
                    <span class="brand-subtitle">SWUST</span>
                </span>
            </a>

            <div class="student-artwork">
                <img
                    src="images/student-portal.png"
                    alt="Student using the consultation portal"
                >
            </div>

            <div class="visual-copy">
                <p class="eyebrow">STUDENT WORKSPACE</p>
                <h1>Make time for a better conversation.</h1>
                <p>
                    Book a consultation with your teacher and keep your requests
                    organized in one place.
                </p>
            </div>
        </section>

        <section class="form-panel" aria-label="Student account">
            <div class="auth-content">
                <span class="role-badge">STUDENT</span>

                <header class="auth-heading">
                    <h2 id="auth-heading">Welcome back</h2>
                    <p id="auth-description">Sign in to your student account.</p>
                </header>

                <div class="auth-tabs" role="tablist" aria-label="Account options">
                    <button
                        class="auth-tab active"
                        id="login-tab"
                        type="button"
                        role="tab"
                        aria-selected="true"
                        aria-controls="login-panel"
                    >
                        Sign in
                    </button>

                    <button
                        class="auth-tab"
                        id="register-tab"
                        type="button"
                        role="tab"
                        aria-selected="false"
                        aria-controls="register-panel"
                    >
                        Create account
                    </button>
                </div>

                <div
                    class="form-message"
                    id="auth-message"
                    role="status"
                    aria-live="polite"
                    hidden
                ></div>

                <section
                    id="login-panel"
                    role="tabpanel"
                    aria-labelledby="login-tab"
                >
                    <form id="student-login-form" class="auth-form">
                        <div class="form-field">
                            <label for="student-login-email">Email address</label>
                            <input
                                id="student-login-email"
                                name="email"
                                type="email"
                                autocomplete="email"
                                placeholder="you@example.com"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="student-login-password">Password</label>

                            <div class="password-field">
                                <input
                                    id="student-login-password"
                                    name="password"
                                    type="password"
                                    autocomplete="current-password"
                                    placeholder="Enter your password"
                                    required
                                >

                                <button
                                    class="password-toggle"
                                    type="button"
                                    data-password-toggle="student-login-password"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                >
                                    Show
                                </button>
                            </div>
                        </div>

                        <button class="primary-button" type="submit">
                            Sign in
                        </button>
                    </form>
                </section>

                <section
                    id="register-panel"
                    role="tabpanel"
                    aria-labelledby="register-tab"
                    hidden
                >
                    <form id="student-register-form" class="auth-form">
                        <div class="form-field">
                            <label for="student-full-name">Full name</label>
                            <input
                                id="student-full-name"
                                name="full_name"
                                type="text"
                                autocomplete="name"
                                placeholder="Enter your full name"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="student-register-email">Email address</label>
                            <input
                                id="student-register-email"
                                name="email"
                                type="email"
                                autocomplete="email"
                                placeholder="you@example.com"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="student-id">Student ID</label>
                            <input
                                id="student-id"
                                name="student_id"
                                type="text"
                                placeholder="Enter your student ID"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="student-department">Department</label>
                            <input
                                id="student-department"
                                name="department"
                                type="text"
                                placeholder="Enter your department"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="student-photo">
                                Profile photo <span>(optional)</span>
                            </label>

                            <input
                                id="student-photo"
                                name="photo"
                                type="file"
                                accept="image/png,image/jpeg,image/webp"
                            >

                            <img
                                id="student-photo-preview"
                                class="photo-preview"
                                alt="Selected profile photo preview"
                                hidden
                            >

                            <small>PNG, JPG, or WebP. Maximum size: 2 MB.</small>
                        </div>

                        <div class="form-field">
                            <label for="student-register-password">Password</label>

                            <div class="password-field">
                                <input
                                    id="student-register-password"
                                    name="password"
                                    type="password"
                                    autocomplete="new-password"
                                    placeholder="Create a password"
                                    minlength="8"
                                    required
                                >

                                <button
                                    class="password-toggle"
                                    type="button"
                                    data-password-toggle="student-register-password"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                >
                                    Show
                                </button>
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="student-confirm-password">
                                Confirm password
                            </label>

                            <div class="password-field">
                                <input
                                    id="student-confirm-password"
                                    name="confirm_password"
                                    type="password"
                                    autocomplete="new-password"
                                    placeholder="Enter your password again"
                                    minlength="8"
                                    required
                                >

                                <button
                                    class="password-toggle"
                                    type="button"
                                    data-password-toggle="student-confirm-password"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                >
                                    Show
                                </button>
                            </div>
                        </div>

                        <button class="primary-button" type="submit">
                            Create student account
                        </button>
                    </form>
                </section>

                <a class="back-link" href="index.html">
                    Back to portal selection
                </a>
            </div>
        </section>
    </main>
</body>
</html>
